<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housing Price AI Estimator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Custom Local Stylesheet -->
    <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <main class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold">Housing Market AI Estimator</h1>
            <p class="text-slate-400">End-to-end data pipeline and k-NN regression model built with vanilla JavaScript.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Input Form Card -->
            <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h2 class="text-xl font-semibold mb-4">Property Features</h2>
                <form id="prediction-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Size (Square Meters)</label>
                        <input type="number" id="sqm" value="120" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Number of Bedrooms</label>
                        <input type="number" id="rooms" value="3" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded p-2 text-white" required>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-2 rounded transition">
                        Calculate Estimated Price
                    </button>
                </form>
            </section>

            <!-- Results Card -->
            <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold mb-4">Model Output</h2>
                    <p class="text-slate-400 text-sm">Estimated Market Valuation:</p>
                    <div id="result-display" class="text-4xl font-bold text-emerald-400 mt-2">$0.00</div>
                </div>
                <div class="text-xs text-slate-500 mt-4">
                    Algorithm: k-Nearest Neighbors (k-NN) Regression | Distance Metric: Euclidean
                </div>
            </section>
        </div>
    </main>

    <!-- Main JavaScript Entry Point -->
    <script type="module" src="./src/js/app.js"></script>
</body>
</html>
